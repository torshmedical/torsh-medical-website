<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TORSH Mail | Secure webmail</title><meta name="description" content="Restricted TORSH business webmail. This page requires an approved account.">
<meta name="theme-color" content="#252B35"><meta name="robots" content="noindex, nofollow">

<script src="assets/js/site-config.js" defer></script><script src="assets/js/main.js" defer></script><script src="assets/js/mail.js" defer></script>
</head><body class="mail-body">
<a class="skip-link" href="#mail-main">Skip to mailbox</a>
<div class="mail-app" data-mail-app><header class="mail-topbar"><a class="mail-brand" href="index.html" aria-label="TORSH website"><img src="assets/images/torsh-wordmark.svg" width="448" height="91" alt="TORSH"><span>Mail</span></a><button class="mail-icon-button mail-menu-button" type="button" data-mail-menu aria-label="Open mailbox navigation"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><label class="mail-search"><span class="visually-hidden">Search mail</span><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input type="search" data-mail-search placeholder="Search mail" autocomplete="off"></label><div class="mail-account"><span class="mail-account__avatar" data-mail-avatar aria-hidden="true">T</span><span><strong data-mail-identity>Checking access…</strong><small>TORSH secure mail</small></span><a href="https://torshmedical.com/cdn-cgi/access/logout">Sign out</a></div></header><div class="mail-frame"><aside class="mail-sidebar" data-mail-sidebar><button class="mail-compose" type="button" data-compose-open><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="compose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m10 14 1-4 8-8 3 3-8 8-4 1Z"/></svg><span>Compose</span></button><nav aria-label="Mailbox folders"><button class="is-active" type="button" data-mail-folder="inbox"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h16l2 10v4H2v-4L4 5Z"/><path d="M3 15h5l2 2h4l2-2h5"/></svg><span>Inbox</span><b data-mail-unread hidden>0</b></button><button type="button" data-mail-folder="starred"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.7l6.2-.9L12 3Z"/></svg><span>Starred</span></button><button type="button" data-mail-folder="sent"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="sent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 11 18-8-7 18-3-7-8-3Z"/><path d="m11 14 4-4"/></svg><span>Sent</span></button><button type="button" data-mail-folder="trash"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></svg><span>Trash</span></button></nav><div class="mail-sidebar__links"><a href="admin.html">Enquiry administration</a><a href="index.html">TORSH website</a></div></aside><main class="mail-main" id="mail-main" tabindex="-1"><section class="mail-list-pane" aria-labelledby="mail-folder-title"><div class="mail-toolbar"><div><span class="eyebrow eyebrow--blue">Mailbox</span><h1 id="mail-folder-title" data-mail-heading>Inbox</h1></div><button class="mail-icon-button" type="button" data-mail-refresh aria-label="Refresh mailbox"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8.5A7 7 0 0 1 18.7 7L20 12M4 12l1.3 5A7 7 0 0 0 17.9 15.5"/></svg></button></div><p class="mail-state" data-mail-state role="status" aria-live="polite">Loading mail…</p><div class="mail-list" data-mail-list></div></section><section class="mail-reader-pane" data-mail-reader aria-live="polite"><div class="mail-empty"><svg class="torsh-icon " data-torsh-icon="contact" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="12" width="54" height="41" rx="3"/><path d="m7 16 25 20 25-20" data-tone="accent" stroke-width="3"/></svg><h2>Select a message</h2><p>Choose a conversation from the list to read it here.</p></div></section></main></div><dialog class="compose-dialog" data-compose-dialog aria-labelledby="compose-title"><form method="dialog" class="compose-form" data-compose-form><div class="compose-head"><h2 id="compose-title">New message</h2><button class="mail-icon-button" type="button" data-compose-close aria-label="Close composer"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div class="compose-from"><span>From</span><strong data-compose-from>Loading…</strong></div><label><span>To</span><input type="text" name="to" autocomplete="off" placeholder="recipient@example.com" required></label><details class="compose-copy"><summary>Cc / Bcc</summary><label><span>Cc</span><input type="text" name="cc" autocomplete="off"></label><label><span>Bcc</span><input type="text" name="bcc" autocomplete="off"></label></details><label><span>Subject</span><input type="text" name="subject" maxlength="180" required></label><label class="compose-message"><span class="visually-hidden">Message</span><textarea name="text" rows="12" maxlength="20000" placeholder="Write a message" required></textarea></label><div class="compose-attachments"><label class="compose-attach"><svg class="torsh-icon torsh-icon--utility " data-torsh-icon="attachment" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8 12 6.4-6.4a4 4 0 0 1 5.6 5.6l-8.5 8.5a6 6 0 0 1-8.5-8.5l8-8"/><path d="m7 15 8-8"/></svg><span>Add attachments</span><input type="file" name="attachments" multiple></label><p>Maximum combined size: 4 MB.</p><ul data-compose-files></ul></div><div class="compose-actions"><button class="btn btn--primary" type="submit">Send<svg class="torsh-icon torsh-icon--utility " data-torsh-icon="sent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 11 18-8-7 18-3-7-8-3Z"/><path d="m11 14 4-4"/></svg></button><button class="btn btn--outline" type="button" data-compose-cancel>Cancel</button><p data-compose-state role="status" aria-live="polite"></p></div></form></dialog></div>
</body></html>
